schema_version: "1.1"
framework_version: "v0.2.1-candidate"
change_id: "CR-GOV-007"
source_compatibility:
  supported_known_versions:
    - "v0.1.0"
    - "v0.1.1"
    - "v0.1.2"
    - "v0.1.3"
    - "v0.1.4"
    - "v0.1.4-beta.1"
    - "v0.1.5"
