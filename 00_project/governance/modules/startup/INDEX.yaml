schema_version: "1.0"
domain: "STARTUP"
owner: "00_project/governance/modules/startup/INDEX.yaml"
trigger_values_are_compared_against: "00_project/governance/GOVERNANCE_ROUTER.yaml#routing_inputs"

selection_policy:
  evaluate_in_list_order: true
  load_only_rules_whose_trigger_is_currently_true: true
  stop_when_selected_rule_resolves_the_startup_question: true
  leaf_may_not_add_undisclosed_sibling_exclusions: true
  no_match: "RULE_NOT_FOUND"

rules:
  - id: "STARTUP-PROJECT-CLASSIFICATION"
    path: "00_project/governance/modules/startup/PROJECT_CLASSIFICATION_AND_MIGRATION.md"
    must_read_when:
      - "PROJECT_TAKEOVER"
      - "PROJECT_LIFECYCLE_UNKNOWN"
      - "LEGACY_UNSTANDARDIZED"
      - "LEGACY_MIGRATION"
  - id: "STARTUP-KNOWLEDGE-ROLE-FACTS"
    path: "00_project/governance/modules/startup/KNOWLEDGE_ROLE_AND_FACTS.md"
    must_read_when:
      - "ROLE_ASSIGNMENT_OR_CURRENT_TRUTH_NEEDED"
      - "KNOWLEDGE_MANIFEST_CREATION"
      - "FACT_CONFLICT"
      - "SESSION_START"
  - id: "STARTUP-TAKEOVER-TASK-CHECKS"
    path: "00_project/governance/modules/startup/TAKEOVER_AND_TASK_CHECKS.md"
    must_read_when:
      - "FIRST_PROJECT_ENTRY"
      - "MEDIUM_OR_LARGE_TASK_START"
      - "TASK_COMPLETION"
      - "CONTEXT_THRESHOLD_REACHED"
      - "TASK_START_OR_COMPLETION"

rules_are_selected_by_trigger_not_read_all_by_default: true
