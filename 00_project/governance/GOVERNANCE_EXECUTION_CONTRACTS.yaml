  required_fields:
    - "interaction_id"
    - "interaction_contract_id"
    - "contract_version"
    - "sender_role"
    - "receiver_role"
    - "task_or_work_package_id"
    - "action_type"
    - "scope"
    - "authority_source"
    - "input_evidence"
    - "receipt"
    - "status"
    - "output_reference"
    - "terminal_state"
    - "error_and_escalation"
    - "audit_reference"
