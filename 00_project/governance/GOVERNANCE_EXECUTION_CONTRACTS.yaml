    - "schema_version"
    - "role_id"
    - "stable_role_brief_ref"
    - "project_ref"
    - "project_structure_binding"
    - "task_or_work_package_id"
    - "output_contract_ref"
    - "current_or_applicable_gate_binding"
    - "applicable_fact_owner_bindings"
    - "upstream_roles"
    - "downstream_roles"
    - "inputs"
    - "outputs"
    - "allowed_process_starts"
    - "allowed_tools_and_actions"
    - "forbidden_actions_and_side_effects"
    - "authority_source"
    - "authorized_until"
    - "human_escalation_triggers"
    - "knowledge_manifest"
    - "interaction_contract_refs"
    - "model_binding"
    - "runtime_binding"
    - "harness_binding"
    - "session_binding"
    - "workspace_binding"
    - "enforcement_mode"
    - "generated_from"
    - "validity"
    - "invalidation_conditions"
  binding_contracts:
    current_or_applicable_gate_binding:
      required_fields:
        - "gate_id"
        - "gate_status"
        - "authority_source"
    applicable_fact_owner_bindings:
      cardinality: "ONE_OR_MORE"
      required_item_fields:
        - "fact_scope"
        - "fact_owner_ref"
        - "authority_source"
    project_structure_binding:
      required_fields:
        - "project_structure_mode"
        - "project_id"
        - "subproject_id_or_not_applicable"
        - "module_id_or_not_applicable"
        - "project_structure_map_ref"
    workspace_binding:
      required_fields:
        - "access_mode"
        - "worktree_id_or_not_applicable"
        - "branch_or_detached_target_or_not_applicable"
        - "base_commit"
        - "write_scope_or_none"
        - "write_lease_status_or_not_applicable"
  binding_validation_sources:
    - "CURRENT_TRUTH"
    - "STABLE_ROLE_BRIEF"
    - "TASK_OR_WORK_PACKAGE"
    - "AUTHORIZATION"
  readiness_fail_closed_on:
    - "BINDING_ABSENT"
    - "BINDING_STALE"
    - "BINDING_CONFLICTING"
  readiness_states:
    - "ROLE_PROFILE_READY"
    - "ROLE_PROFILE_NOT_READY"

knowledge_manifest:
  contract_id: "KNOWLEDGE_MANIFEST"
  required_fields:
