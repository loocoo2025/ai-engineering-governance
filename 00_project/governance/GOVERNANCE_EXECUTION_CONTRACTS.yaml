    - "authority_owner"
    - "action"
    - "scope"
    - "target"
    - "allowed_side_effects"
    - "forbidden_side_effects"
    - "validity"
    - "consumption_event"
    - "terminal_state"
    - "retry_policy"
    - "escalation"
    - "status"
    - "audit_reference"
  lifecycle_states:
    - "PROPOSED"
    - "ISSUED_UNUSED"
    - "CONSUMED"
    - "CANCELLED"
    - "EXPIRED"
    - "EXECUTION_COMPLETED"
    - "RESULT_UNKNOWN_RECONCILIATION_REQUIRED"
  independent_action_classes:
    - "FILE_MODIFICATION"
    - "COMMIT"
    - "TAG_CREATION"
    - "BASELINE_ADOPTION"
    - "INDEPENDENT_SESSION_CREATION"
    - "FORMAL_C04_DISPATCH"
    - "DEPENDENCY_INSTALLATION"
    - "REAL_MODEL_INVOCATION"
    - "PUSH"
    - "PULL_REQUEST"
    - "REMOTE_MUTATION"
    - "FORMAL_SEAL"
    - "RELEASE"
  implication_between_action_classes: false

task_state_machine:
  contract_id: "TASK_STATE_MACHINE"
  owner: "00_project/ai_context/ACTIVE_TASKS.md"
  states:
    - "TODO"
    - "READY"
    - "IN_PROGRESS"
    - "BLOCKED"
    - "OUTPUT_READY"
    - "READY_FOR_REVIEW"
    - "DONE"
    - "CANCELLED"
  terminal_states:
    - "DONE"
    - "CANCELLED"
  transitions:
    TODO:
      - "READY"
      - "CANCELLED"
    READY:
      - "IN_PROGRESS"
      - "BLOCKED"
      - "CANCELLED"
    IN_PROGRESS:
      - "OUTPUT_READY"
      - "BLOCKED"
      - "CANCELLED"
    OUTPUT_READY:
      - "READY_FOR_REVIEW"
      - "DONE"
      - "BLOCKED"
    READY_FOR_REVIEW:
      - "DONE"
      - "IN_PROGRESS"
      - "BLOCKED"
    BLOCKED:
      - "READY"
      - "IN_PROGRESS"
      - "OUTPUT_READY"
      - "READY_FOR_REVIEW"
      - "CANCELLED"
    DONE: []
    CANCELLED: []

