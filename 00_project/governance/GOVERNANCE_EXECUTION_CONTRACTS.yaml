    - "AUTHORIZED"
    - "DISPATCHED"
    - "ACKNOWLEDGED"
    - "IN_PROGRESS"
    - "OUTPUT_READY"
    - "COMPLETED"
    - "BLOCKED"
    - "CANCELLED"
    - "FAILED"
    - "RESULT_UNKNOWN_RECONCILIATION_REQUIRED"

interaction_operation:
